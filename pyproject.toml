[project]
name = "medical-imaging"
version = "0.1.0"
description = "FastAPI backend + NiceGUI UI for medical imaging showcases (bedsore classification, OCR, anonymization)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web / UI
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9", # required by FastAPI for File/Form uploads
    "nicegui>=2.0",
    "requests>=2.31",
    # ML
    "torch>=2.8",              # torch.export.pt2_archive is used by export_cpu_model
    "torchvision>=0.23",
    "timm>=1.0",
    "transformers>=4.56",      # uses the `dtype=` kwarg in from_pretrained
    "accelerate>=1.0",
    # Config / data
    "omegaconf>=2.3",
    "pillow>=10.0",
    "pdf2image>=1.17",         # needs the system `poppler-utils` package
    "pandas>=2.2",
    "pyarrow>=16.0",           # parquet I/O
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Synthetic anonymization dataset generation (generate_dataset.sh).
# vLLM pins its own torch version and supports a narrower Python range.
dataset = [
    "vllm>=0.10",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["medical_imaging"]
